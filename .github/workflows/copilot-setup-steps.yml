name: Copilot setup steps

on:
  workflow_dispatch:
  pull_request:
    paths: [.github/workflows/copilot-setup-steps.yml]

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@55ec9447dda3d1cf6bd587150f3262f30ee10815 # v3.4.2
        with:
          dotnet-version: 9.x
      - name: Offline harness regression checks
        shell: pwsh
        run: ./scripts/Test-Maintenance.ps1
      - name: Prepare configured exact-release IdWeb evidence
        shell: pwsh
        env:
          MAINTENANCE_PACKAGE: ${{ vars.MAINTENANCE_PACKAGE }}
          MAINTENANCE_TARGET_VERSION: ${{ vars.MAINTENANCE_TARGET_VERSION }}
        run: |
          if (!$env:MAINTENANCE_PACKAGE -or !$env:MAINTENANCE_TARGET_VERSION) {
            Write-Host 'SETUP_BLOCKED for release tasks: configure MAINTENANCE_PACKAGE and MAINTENANCE_TARGET_VERSION. No source was downloaded.'
            exit 0
          }
          ./scripts/Get-IdWebSourceEvidence.ps1 -Package $env:MAINTENANCE_PACKAGE -TargetVersion $env:MAINTENANCE_TARGET_VERSION
          if (!(Test-Path .maintenance-evidence/manifest.json)) { throw 'SETUP_BLOCKED: source manifest was not prepared.' }
          git check-ignore --quiet .maintenance-evidence/manifest.json
          if ($LASTEXITCODE -ne 0) { throw 'Source evidence must remain ignored.' }